      function compile(data) {
          const o = { weekday: [], weekend: [] };

          for (const r of data) {
              for (const svc of ['weekday', 'weekend']) {
                  const ss = r[svc];
                  if (!ss) continue;

                  const n = Math.max(...ss.map(s => s.times.length));

                  for (let j = 0; j < n; j++) {
                      let q = [];
                      let prev = -1;

                      for (const s of ss) {
                          const t = s.times[j];
                          if (Number.isFinite(t) && t >= prev) {
                              q.push({ stop: s.stop, time: t });
                              prev = t;
                          }
                      }

                      if (q.length > 1) {
                          o[svc].push({
                              id: `${r.route}|${svc}|${j}`,
                              route: r.route,
                              stops: q
                          });
                      }
                  }
              }
          }

          return o;
      }

              if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

                  active = Math.max(0, Math.min(items.length - 1, active + (e.key === 'ArrowDown' ? 1 : -1)));
                  items.forEach((x, i) => x.classList.toggle('active', i === active));
                  items[active]?.scrollIntoView({ block: 'nearest' });
              } else if (e.key === 'Enter' && active >= 0) {

      function indexes(svc, sel) {
          const b = new Map();
          const a = new Map();
          for (const tr of trips[svc]) {
              if (!sel.has(tr.route)) continue;
              tr.stops.forEach((s, i) => {
                  if (i < tr.stops.length - 1) {
                      if (!b.has(s.stop)) b.set(s.stop, []);
                      b.get(s.stop).push({ tr, i });
                  }
                  if (i > 0) {
                      if (!a.has(s.stop)) a.set(s.stop, []);
                      a.get(s.stop).push({ tr, i });
                  }
              });
          }
          for (const list of b.values()) list.sort((x,y)=>x.tr.stops[x.i].time-y.tr.stops[y.i].time);
          for (const list of a.values()) list.sort((x,y)=>y.tr.stops[y.i].time-x.tr.stops[x.i].time);
          return { b, a };
      }

      class MinHeap {
          constructor(compare) { this.data=[]; this.compare=compare; }
          get size(){ return this.data.length; }
          push(v){
              const a=this.data; a.push(v); let i=a.length-1;
              while(i>0){const p=(i-1)>>1;if(this.compare(a[p],a[i])<=0)break;[a[p],a[i]]=[a[i],a[p]];i=p;}
          }
          pop(){
              const a=this.data;if(!a.length)return undefined;const root=a[0],last=a.pop();
              if(a.length){a[0]=last;let i=0;for(;;){let l=i*2+1,r=l+1,m=i;if(l<a.length&&this.compare(a[l],a[m])<0)m=l;if(r<a.length&&this.compare(a[r],a[m])<0)m=r;if(m===i)break;[a[i],a[m]]=[a[m],a[i]];i=m;}}
              return root;
          }
      }

      function stateDominated(labels, candidate, backward=false) {
          const list=labels.get(candidate.stop) || [];
          const dominated=list.some(x =>
              x.transfers <= candidate.transfers &&
              x.wait <= candidate.wait &&
              (backward ? x.time >= candidate.time : x.time <= candidate.time) &&
              (x.transfers < candidate.transfers || x.wait < candidate.wait || (backward ? x.time > candidate.time : x.time < candidate.time))
          );
          if (dominated) return true;
          const kept=list.filter(x => !(
              candidate.transfers <= x.transfers && candidate.wait <= x.wait &&
              (backward ? candidate.time >= x.time : candidate.time <= x.time) &&
              (candidate.transfers < x.transfers || candidate.wait < x.wait || (backward ? candidate.time > x.time : candidate.time < x.time))
          ));
          kept.push({time:candidate.time,transfers:candidate.transfers,wait:candidate.wait});
          labels.set(candidate.stop, kept.slice(-24));
          return false;
      }

      function fw(x, start, end, t0, c, wanted=20) {
          const out=[], labels=new Map();
          const q=new MinHeap((p,r)=>p.time-r.time || p.transfers-r.transfers || p.wait-r.wait);
          q.push({stop:start,time:t0,legs:[],transfers:0,wait:0,lastTrip:null});
          let expanded=0;
          const maxResults=Math.min(250, Math.max(40, wanted*4));
          while(q.size && expanded++ < 20000 && out.length < maxResults){
              const s=q.pop();
              if(s.stop===end && s.legs.length){out.push(s);continue;}
              if(stateDominated(labels,s,false) && s.legs.length) continue;
              const boardings=x.b.get(s.stop)||[];
              for(const z of boardings){
                  const dep=z.tr.stops[z.i].time;
                  const same=s.lastTrip===z.tr.id;
                  const transfer=!!s.lastTrip && !same;
                  const wait=dep-s.time;
                  const min=transfer?c.min:0;
                  if(dep < s.time+min || dep-t0>c.h || (transfer && wait>c.wait)) continue;
                  const tn=s.transfers+(transfer?1:0); if(tn>c.mt) continue;
                  // Riding to every downstream stop is needed for transfers, but labels prune dominated states.
                  for(let k=z.i+1;k<z.tr.stops.length;k++){
                      const d=z.tr.stops[k]; if(d.time-t0>c.h) break;
                      q.push({stop:d.stop,time:d.time,transfers:tn,wait:s.wait+(transfer?wait:0),lastTrip:z.tr.id,
                          legs:[...s.legs,{route:z.tr.route,tripId:z.tr.id,from:s.stop,to:d.stop,depart:dep,arrive:d.time}]});
                  }
              }
          }
          return uniq(out);
      }

      function bw(x, start, end, ddl, c, wanted=20) {
          const out=[], labels=new Map();
          const q=new MinHeap((p,r)=>r.time-p.time || p.transfers-r.transfers || p.wait-r.wait);
          q.push({stop:end,time:ddl,legs:[],transfers:0,wait:0,nextTrip:null});
          let expanded=0;
          const maxResults=Math.min(250, Math.max(40, wanted*4));
          while(q.size && expanded++ < 20000 && out.length < maxResults){
              const s=q.pop();
              if(s.stop===start && s.legs.length){out.push(s);continue;}
              if(stateDominated(labels,s,true) && s.legs.length) continue;
              for(const z of x.a.get(s.stop)||[]){
                  const arr=z.tr.stops[z.i].time;
                  const same=s.nextTrip===z.tr.id;
                  const transfer=!!s.nextTrip && !same;
                  const wait=s.time-arr;
                  const min=transfer?c.min:0;
                  if(arr > s.time-min || ddl-arr>c.h || (transfer && wait>c.wait)) continue;
                  const tn=s.transfers+(transfer?1:0); if(tn>c.mt) continue;
                  for(let k=z.i-1;k>=0;k--){
                      const d=z.tr.stops[k]; if(ddl-d.time>c.h) break;
                      q.push({stop:d.stop,time:d.time,transfers:tn,wait:s.wait+(transfer?wait:0),nextTrip:z.tr.id,
                          legs:[{route:z.tr.route,tripId:z.tr.id,from:d.stop,to:s.stop,depart:d.time,arrive:arr},...s.legs]});
                  }
              }
          }
          return uniq(out);
      }
      function mergedLegs(r) {
          const legs=[];
          for(const l of r.legs){
              const p=legs.at(-1);
              if(p && p.tripId===l.tripId && p.to===l.from){p.to=l.to;p.arrive=l.arrive;}
              else legs.push({...l});
          }
          return legs;
      }
      function itinerarySignature(r) {
          return mergedLegs(r).map(l=>`${l.route}|${l.tripId}|${l.from}|${l.to}|${l.depart}|${l.arrive}`).join('>');
      }
      function uniq(a) {
          const m=new Map();
          for(const r of a){const k=itinerarySignature(r);if(!m.has(k))m.set(k,r);}
          return [...m.values()];
      }
      function diverseAlternatives(routes, fastestRoute, optimizedRoute, requested, mode) {
          const skip=new Set([itinerarySignature(fastestRoute),itinerarySignature(optimizedRoute)]);
          const seen=new Set();
          const out=[];
          for(const r of [...routes].sort(fast(mode))){
              const sig=itinerarySignature(r);
              if(skip.has(sig)||seen.has(sig))continue;
              seen.add(sig); out.push(r);
              if(out.length>=requested)break;
          }
          return out;
      }
      function M(r) {
          let a = r.legs[0];
          let b = r.legs.at(-1);
          return {
              d: a.depart,
              a: b.arrive,
              dur: b.arrive - a.depart,
              t: r.transfers,
              w: r.wait
          };
      }

      function fast(mode) {
          return (x, y) => {
              x = M(x);
              y = M(y);

              return mode === 'depart'
                  ? x.a - y.a || x.t - y.t || x.dur - y.dur
                  : y.d - x.d || x.t - y.t || x.dur - y.dur;
          };
      }

      function opt(k, mode) {
          return (x, y) => {
              let a = M(x);
              let b = M(y);

              if (k === 'duration') return a.dur - b.dur || a.t - b.t;
              if (k === 'wait') return a.w - b.w || a.t - b.t;
              if (k === 'balanced') {
                  return (a.dur + 15 * a.t + 0.25 * a.w) -
                        (b.dur + 15 * b.t + 0.25 * b.w);
              }

              return a.t - b.t || a.dur - b.dur || fast(mode)(x, y);
          };
      }

      function card(r, title) {
          let m = M(r);
          let legs = [];

          for (const l of r.legs) {
              let p = legs.at(-1);

              if (p && p.tripId === l.tripId && p.to === l.from) {
                  p.to = l.to;
                  p.arrive = l.arrive;
              } else {
                  legs.push({ ...l });
              }
          }

          return `
              <div class="trip">
                  <h3>${title}</h3>
                  <b>${F(m.d)} to ${F(m.a)}</b>
                  · ${m.dur} min
                  · ${m.t} transfer${m.t === 1 ? '' : 's'}
                  · ${m.w} min transfer wait
                  ${legs.map(l => `
                      <div class="leg">
                          <b>${E(l.route)}</b>:
                          ${E(l.from)}
                          <span class="small">${F(l.depart)}</span>
                          to
                          ${E(l.to)}
                          <span class="small">${F(l.arrive)}</span>
                      </div>
                  `).join('')}
              </div>
          `;
      }

                  const p=[...o].sort(opt(V('priority'),mode))[0];
                  let h='<div class="results">'+card(f,'Fastest Route')+card(p,'Optimized Route')+'</div>'; //death by drupal
                  const alternatives=diverseAlternatives(o,f,p,wanted,mode);
                  if(document.getElementById('showAll').checked){
                      h+='<div open><summary><b>Alternative Options ('+alternatives.length+')</b></summary>'+alternatives.map((r,i)=>card(r,'Option '+(i+1))).join('')+'</div>';
                  }
                  res.innerHTML=h;
                  const note=alternatives.length<wanted?` Only ${alternatives.length} distinct alternatives were found; duplicates are not padded.`:` Showing ${alternatives.length} distinct alternatives.`;
                  st.textContent=`Found ${o.length} feasible candidate itineraries.${note}`;
              }catch(err){console.error(err);st.textContent='Trip search failed: '+err.message;}
              finally{btn.disabled=false;}
          },0));
      }
      function init() {
          document.getElementById('routes').innerHTML = routesData
              .map(r => `
                  <label>
                      <input class="rc" type="checkbox" value="${E(r.route)}" checked>
                      ${E(r.route)}
                  </label>
              `)
              .join('');

          setupAuto('start', 'startDrop');
          setupAuto('end', 'endDrop');

          document.getElementById('all').onclick = () =>
              document.querySelectorAll('.rc').forEach(x => x.checked = true);

          document.getElementById('none').onclick = () =>
              document.querySelectorAll('.rc').forEach(x => x.checked = false);

          document.getElementById('swap').onclick = () => {
              let a = document.getElementById('start');
              let b = document.getElementById('end');
              [a.value, b.value] = [b.value, a.value];
          };

          document.getElementById('now').onclick = () => {
              let P = new Intl.DateTimeFormat('en-US', {
                  timeZone: 'America/Los_Angeles',
                  hour: '2-digit',
                  minute: '2-digit',
                  hourCycle: 'h23'
              }).formatToParts(new Date());

              let v = Object.fromEntries(P.map(x => [x.type, x.value]));
              document.getElementById('time').value = `${v.hour}:${v.minute}`;
          };

          document.getElementById('plan').onclick = plan;
      }

      init();

    </script>
